[project]
name = "jogos-vivos"
version = "0.1.0"
description = "Graph workflow open-source que cria, verifica e evolui web games continuamente — sem cara de IA."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "openai>=1.40",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
jogos-vivos = "fabrica.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fabrica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
